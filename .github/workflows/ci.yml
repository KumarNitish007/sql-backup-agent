name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build · unit + SQL Server + Azure Blob tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore SqlBackupAgent.sln
      - run: dotnet build SqlBackupAgent.sln -c Release --no-restore
      - name: Vulnerable package audit
        run: |
          dotnet list SqlBackupAgent.sln package --vulnerable --include-transitive | tee audit.txt
          ! grep -q "has the following vulnerable packages" audit.txt
      # Integration tests start SQL Server 2022 (with a bind-mounted /backups folder) and Azurite
      # via Testcontainers, then take real full/diff/log backups and do a real point-in-time restore.
      - name: Tests
        run: dotnet test SqlBackupAgent.sln -c Release --no-build --logger "trx;LogFileName=tests.trx" --logger "console;verbosity=normal"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: tests/**/TestResults/*.trx
